<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}" class="graphite-site">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{meta_title_home}}</title>
<meta name="description" content="{{meta_desc_home}}" />
<meta name="apple-itunes-app" content="app-id=6783131829" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#161819" />
{{SEO}}
<link rel="icon" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/transitions.css" />
<script>
// Before anything is drawn. "motion" lets the few entrances in styles.css
// wait for the script at the end of the page; without it, or with Reduce
// Motion, everything is simply there.
(() => {
  const root = document.documentElement;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion');
  let transition;
  window.addEventListener("pagereveal", event => {
    transition = event.viewTransition;
    if (!transition) {
      root.classList.remove("page-crossfade");
      return;
    }
    // A native page crossfade is already an entrance: the hero skips its own.
    root.classList.add("soft-arrival");
    const current = transition;
    root.classList.add("page-crossfade");
    current.finished.catch(() => {}).finally(() => {
      if (transition !== current) return;
      transition = null;
      root.classList.remove("page-crossfade");
    });
  });
  // Intent takes priority over decoration; never consume the user's event.
  const interrupt = () => transition?.skipTransition();
  window.addEventListener("pointerdown", interrupt, { capture: true, passive: true });
  window.addEventListener("keydown", interrupt, { capture: true });
})();
</script>
</head>
<body class="lock-scene home-scene">

{{HEADER}}

<main class="home">
  <!-- The name, set large, beside what it is. Under both, where to get it and
       what it costs, in two plain sentences. -->
  <section class="hero wrap" aria-labelledby="hero-title">
    <div class="hero-mark">
      <img class="hero-icon" src="/logo.png" width="72" height="72" alt="" />
      <h1 id="hero-title" class="wordmark"><span class="mask"><span class="rise" style="--anim:mask-rise">Privaro</span></span></h1>
    </div>
    <div class="hero-copy rise" style="--anim:fade;--d:.35s">
      <p class="tagline">{{home_tagline}}</p>
      <p class="lead">{{hero_lead}}</p>
    </div>
    <div class="buy">
      <a class="appstore" href="https://apps.apple.com/app/id6783131829" aria-label="{{badge_label}}">
        <img src="/appstore-badge-white.svg" width="150" height="50" alt="{{badge_label}}" />
      </a>
      <p class="buy-note"><span>{{buy_free}}</span> <span>{{buy_pro}}</span></p>
    </div>
  </section>

  <!-- The app itself: four screens in a row, each with what it's for. Each is
       a button that opens the viewer (presentation.js). -->
  <section class="gallery">
    <div class="shots wrap">
      <figure class="rise" style="--anim:phone-in;--i:0"><img src="{{SHOTS}}shot-lock.jpg" width="760" height="1573" alt="{{alt_lock}}" fetchpriority="high" /><figcaption><strong>{{cap_lock}}</strong> <span>{{shot_lock_d}}</span></figcaption></figure>
      <figure class="rise" style="--anim:phone-in;--i:1"><img src="{{SHOTS}}shot-vault.jpg" width="760" height="1573" alt="{{alt_vault}}" /><figcaption><strong>{{cap_vault}}</strong> <span>{{shot_vault_d}}</span></figcaption></figure>
      <figure class="rise" style="--anim:phone-in;--i:2"><img src="{{SHOTS}}shot-albums.jpg" width="760" height="1573" alt="{{alt_albums}}" decoding="async" /><figcaption><strong>{{cap_albums}}</strong> <span>{{shot_albums_d}}</span></figcaption></figure>
      <figure class="rise" style="--anim:phone-in;--i:3"><img src="{{SHOTS}}shot-privacy.jpg" width="760" height="1573" alt="{{alt_privacy}}" decoding="async" /><figcaption><strong>{{cap_privacy}}</strong> <span>{{shot_privacy_d}}</span></figcaption></figure>
    </div>
  </section>

  <!-- How it's kept private: one statement, the illustration, and the facts
       behind it as a list, in claims the Security Overview backs up. -->
  <section class="safety wrap" aria-labelledby="safety-title">
    <h2 id="safety-title" class="display">
      <span class="mask"><span class="rise" style="--anim:mask-rise">{{vignette_caption}}</span></span>
      <span class="mask dim"><span class="rise" style="--anim:mask-rise;--d:.1s">{{home_sec_sub}}</span></span>
    </h2>
    <div class="safety-body">
      <div class="safety-art">
{{VIGNETTE}}
      </div>
      <div class="safety-facts">
        <dl class="ledger">
          <div><dt>AES-256</dt><dd>{{fact1_d}}</dd></div>
          <div><dt>{{fact2_t}}</dt><dd>{{fact2_d}}</dd></div>
          <div><dt>{{fact3_t}}</dt><dd>{{fact3_d}}</dd></div>
          <div><dt>{{fact4_t}}</dt><dd>{{fact4_d}}</dd></div>
        </dl>
        <a class="more" href="{{SECURITY_URL}}">{{home_sec_link}}</a>
      </div>
    </div>
  </section>

  <!-- The last word, and the Lock Screen rising out of the bottom edge, the
       way the phone does in the illustration above. -->
  <section class="closing wrap" aria-labelledby="closing-title">
    <div class="closing-copy">
      <h2 id="closing-title" class="display"><span class="mask"><span class="rise" style="--anim:mask-rise">{{home_cta_title}}</span></span></h2>
      <div class="buy">
        <a class="appstore" href="https://apps.apple.com/app/id6783131829" aria-label="{{badge_label}}">
          <img src="/appstore-badge-white.svg" width="150" height="50" alt="{{badge_label}}" loading="lazy" />
        </a>
        <p class="buy-note"><span>{{buy_free}}</span></p>
      </div>
    </div>
    <div class="closing-shot"><img class="rise" style="--anim:phone-up" src="{{SHOTS}}shot-lock.jpg" width="760" height="1573" alt="" loading="lazy" decoding="async" /></div>
  </section>
</main>

{{FOOTER}}
<script>
// Each entrance plays once it's on screen. Inline, like the line in <head>,
// so a script that fails to load can never leave anything hidden.
(() => {
  const items = [...document.querySelectorAll('.rise')];
  const show = el => el.classList.add('in-view');
  if (!('IntersectionObserver' in window)) return items.forEach(show);
  // A headline line starts below its mask, clipped out of view, so it's the
  // mask that's watched; the phones arrive together, when their row does.
  const owner = new Map();
  items.forEach(el => {
    const target = el.parentElement.closest('.mask, .shots') || el;
    owner.set(target, [...(owner.get(target) || []), el]);
  });
  const watch = new IntersectionObserver(entries => entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    owner.get(entry.target).forEach(show);
    watch.unobserve(entry.target);
  }), { rootMargin: '0px 0px -6% 0px' });
  owner.forEach((_, target) => watch.observe(target));
  // Keyboard focus and in-page links must never land on something hidden.
  document.addEventListener('focusin', e => e.target.closest('.rise')?.classList.add('in-view'));
})();
</script>
<script src="/price.js" defer></script>
</body>
</html>
