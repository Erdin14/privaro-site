<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{meta_title_home}}</title>
<meta name="description" content="{{meta_desc_home}}" />
<meta name="apple-itunes-app" content="app-id=6783131829" />
<meta name="color-scheme" content="dark" />
{{SEO}}
<link rel="icon" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<!-- Before anything is drawn: the screenshots wait for the script at the end
     of the page to show them. Without JavaScript they're simply there. -->
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="lock-scene">

<!-- The app's lock screen background; see styles.css and scene.js. -->
<div class="scene" aria-hidden="true">
  <canvas class="aurora"></canvas>
  <div class="scene-light"></div>
  <div class="lattice"></div>
  <div class="glint"><div></div></div>
</div>

<main class="home wrap">
  <div class="home-text">
    <img class="icon" src="/logo.png" width="64" height="64" alt="" />
    <h1>Privaro</h1>
    <p class="lead">{{hero_lead}}</p>
    <a class="appstore" href="https://apps.apple.com/app/id6783131829" aria-label="{{badge_label}}">
      <img src="/appstore-badge-white.svg" alt="{{badge_label}}" />
    </a>
    <p class="meta">{{hero_meta}}</p>
  </div>
  <div class="shots">
    <figure><img src="/shots/framed-18-pro-max/shot-lock.jpg" width="760" height="1573" alt="{{alt_lock}}" fetchpriority="high" /><figcaption>{{cap_lock}}</figcaption></figure>
    <figure><img src="/shots/framed-18-pro-max/shot-vault.jpg" width="760" height="1573" alt="{{alt_vault}}" /><figcaption>{{cap_vault}}</figcaption></figure>
    <figure><img src="/shots/framed-18-pro-max/shot-albums.jpg" width="760" height="1573" alt="{{alt_albums}}" /><figcaption>{{cap_albums}}</figcaption></figure>
    <figure><img src="/shots/framed-18-pro-max/shot-privacy.jpg" width="760" height="1573" alt="{{alt_privacy}}" /><figcaption>{{cap_privacy}}</figcaption></figure>
  </div>
</main>

{{FOOTER}}
<script>
// The screenshots arrive once they're on screen (.shots.shown in styles.css):
// on a computer that's straight away, on a phone when you scroll down to them.
// Inline, like the line in <head>, so a script that fails to load can never
// leave them hidden.
(() => {
  const shots = document.querySelector('.shots');
  const show = () => shots.classList.add('shown');
  if (!('IntersectionObserver' in window)) return show();
  const watch = new IntersectionObserver(entries => {
    if (entries.some(entry => entry.isIntersecting)) { show(); watch.disconnect(); }
  }, { threshold: 0.2 });
  watch.observe(shots);
})();
</script>
<script src="/scene.js" defer></script>
<script src="/decrypt.js" defer></script>
</body>
</html>
