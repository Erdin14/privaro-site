<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{meta_title_home}}</title>
<meta name="description" content="{{meta_desc_home}}" />
<meta name="apple-itunes-app" content="app-id=6783131829" />
<meta name="color-scheme" content="dark" />
{{SEO}}
<link rel="icon" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="lock-scene">

<!-- The app's lock screen background; see styles.css and scene.js. -->
<div class="scene" aria-hidden="true">
  <canvas class="aurora"></canvas>
  <div class="scene-light"></div>
  <div class="lattice"></div>
  <div class="glint"><div></div></div>
</div>

<main class="home wrap">
  <div class="home-text">
    <img class="icon" src="/logo.png" width="64" height="64" alt="" />
    <h1>Privaro</h1>
    <p class="lead">{{hero_lead}}</p>
    <a class="appstore" href="https://apps.apple.com/app/id6783131829" aria-label="{{badge_label}}">
      <img src="/appstore-badge-white.svg" alt="{{badge_label}}" />
    </a>
    <p class="meta">{{hero_meta}}</p>
  </div>
  <div class="shots">
    <img src="/shots/shot-lock.jpg" width="700" height="1521" alt="{{alt_lock}}" fetchpriority="high" />
    <img src="/shots/shot-vault.jpg" width="700" height="1521" alt="{{alt_vault}}" />
  </div>
</main>

{{FOOTER}}
<script src="/scene.js" defer></script>
</body>
</html>
