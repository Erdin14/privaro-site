<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}" class="graphite-site">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Privaro</title>
<meta name="color-scheme" content="dark" />
{{SEO}}
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/transitions.css" />
<script>
// Register before first reveal, including restored history entries.
(() => {
  let transition;
  window.addEventListener("pagereveal", event => {
    transition = event.viewTransition;
    if (!transition) {
      document.documentElement.classList.remove("page-crossfade");
      return;
    }
    const current = transition;
    document.documentElement.classList.add("page-crossfade");
    current.finished.catch(() => {}).finally(() => {
      if (transition !== current) return;
      transition = null;
      document.documentElement.classList.remove("page-crossfade");
    });
  });
  // Intent takes priority over decoration; never consume the user's event.
  const interrupt = () => transition?.skipTransition();
  window.addEventListener("pointerdown", interrupt, { capture: true, passive: true });
  window.addEventListener("keydown", interrupt, { capture: true });
})();
</script>
</head>
<body class="lock-scene">

{{HEADER}}

<main class="page wrap missing">

  <!-- Nothing at this address: what happened and where to go instead, and
       beside it the Lock Screen, its foot fading into the page, as at the
       end of the homepage. -->
  <section class="missing-body" aria-labelledby="missing-title">
    <div class="missing-copy">
      <p class="missing-code">Error 404</p>
      <h1 id="missing-title">This page doesn’t exist</h1>
      <p class="intro">The link may be old, or there’s a typo in it.</p>
      <a class="more missing-home" href="{{HOME_URL}}">Go to the homepage</a>
      <nav class="missing-others" aria-label="Other pages">
        <a href="{{PRO_URL}}">{{footer_pro}}</a>
        <a href="{{SECURITY_URL}}">{{footer_security}}</a>
        <a href="{{FAQ_URL}}">{{footer_faq}}</a>
      </nav>
    </div>
    <div class="closing-shot"><picture><source srcset="{{SHOTS}}shot-lock.webp" type="image/webp" /><img src="{{SHOTS}}shot-lock.jpg" width="760" height="1573" alt="" decoding="async" /></picture></div>
  </section>

</main>

{{FOOTER}}
</body>
</html>
