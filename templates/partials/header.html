<a class="skip" href="#main">{{skip_link}}</a>
<!-- The other pages are listed twice, and only one list is ever there
     (styles.css takes the other out, for screen readers and the keyboard
     too). On wide screens they're left of the name, so they come before it;
     on phones they're a row under the name, the globe and the download, so
     they come after those. One list, moved by CSS, was read out and tabbed
     through in an order nobody saw: "Pro features" before the name it sat
     under. -->
<header class="site-head">
  <div class="head-bar">
    <nav class="head-links head-links-wide" aria-label="Privaro">
      <a href="{{PRO_URL}}">{{footer_pro}}</a>
      <a href="{{SECURITY_URL}}">{{footer_security}}</a>
      <a href="{{FAQ_URL}}">{{footer_faq}}</a>
    </nav>
    <a class="brand" href="{{HOME_URL}}"><img src="/logo.png" width="28" height="28" alt="" />Privaro</a>
    <div class="head-end">
      {{SWITCHER}}
      <a class="head-get" href="{{APP_STORE}}" aria-label="{{badge_label}}">{{nav_download}}</a>
    </div>
    <nav class="head-links head-links-phone" aria-label="Privaro">
      <a href="{{PRO_URL}}">{{footer_pro}}</a>
      <a href="{{SECURITY_URL}}">{{footer_security}}</a>
      <a href="{{FAQ_URL}}">{{footer_faq}}</a>
    </nav>
  </div>
</header>
