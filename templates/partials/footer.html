    {{SWITCHER}}

<script>
document.getElementById('year').textContent = new Date().getFullYear();
// The language menu is a <details>; close it on a click elsewhere or on Escape.
// On phones a click on the dimmed page lands on the <details> itself (its
// ::before is the dimming), so that counts as elsewhere too.
const lang = document.querySelector('.lang');
document.addEventListener('click', e => {
  if (lang.open && (e.target === lang || !lang.contains(e.target))) lang.open = false;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lang.open) { lang.open = false; lang.querySelector('summary').focus(); }
});
</script>
