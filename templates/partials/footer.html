<!-- A slim pill of links and the page's controls, matching the header's,
     and one quiet line under it. -->
<footer class="site-foot wrap">
  <nav class="foot-links">
    <a href="{{PRO_URL}}">{{footer_pro}}</a>
    <a href="{{FAQ_URL}}">{{footer_faq}}</a>
    <a href="{{SECURITY_URL}}">{{footer_security}}</a>
    <a href="{{PRIVACY_URL}}">{{footer_privacy}}</a>
    <a href="{{TERMS_URL}}">{{footer_terms}}</a>
    <a href="mailto:erdincdubu@icloud.com">{{footer_contact}}</a>
    {{SWITCHER}}
  </nav>
  <p class="foot-note">© <span id="year">2026</span> Privaro<span aria-hidden="true"> · </span>{{footer_note}}</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
// The language menu is a <details>; close it on a click elsewhere or on Escape.
// On phones a click on the dimmed page lands on the <details> itself (its
// ::before is the dimming), so that counts as elsewhere too.
const lang = document.querySelector('.lang');
document.addEventListener('click', e => {
  if (lang.open && (e.target === lang || !lang.contains(e.target))) lang.open = false;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lang.open) { lang.open = false; lang.querySelector('summary').focus(); }
});
</script>

<script src="/presentation.js" data-enlarge="{{viewer_enlarge}}" data-close="{{viewer_close}}" data-previous="{{viewer_previous}}" data-next="{{viewer_next}}" defer></script>
