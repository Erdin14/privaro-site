<!-- A row of plain links and the page's controls, like the header's, and
     one quiet line under it. -->
<footer class="site-foot wrap">
  <nav class="foot-links">
    <a href="{{PRO_URL}}">{{footer_pro}}</a>
    <a href="{{FAQ_URL}}">{{footer_faq}}</a>
    <a href="{{SECURITY_URL}}">{{footer_security}}</a>
    <a href="{{PRIVACY_URL}}">{{footer_privacy}}</a>
    <a href="{{TERMS_URL}}">{{footer_terms}}</a>
    <a href="mailto:erdincdubu@icloud.com">{{footer_contact}}</a>
    {{SWITCHER}}
  </nav>
  <p class="foot-note">© <span id="year">2026</span> Privaro. {{footer_note}}</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
// The language menus (one in the header, one in the footer) are <details>;
// close an open one on a click elsewhere, on its own button, or on Escape.
// On phones a click on the dimmed page lands on the <details> itself (its
// ::before is the dimming), so that counts as elsewhere too. A menu leaves
// as it came rather than vanishing: it's held open for the moment its way
// out takes (.closing in styles.css), then closed. With Reduce Motion it
// just closes.
const langs = document.querySelectorAll('.lang');
const still = matchMedia('(prefers-reduced-motion: reduce)');
const shut = lang => {
  if (!lang.open || lang.classList.contains('closing')) return;
  if (still.matches) { lang.open = false; return; }
  lang.classList.add('closing');
  setTimeout(() => { lang.open = false; lang.classList.remove('closing'); }, 200);
};
document.addEventListener('click', e => langs.forEach(lang => {
  if (!lang.open) return;
  const summary = e.target.closest ? e.target.closest('summary') : null;
  if (summary && lang.contains(summary)) { e.preventDefault(); shut(lang); }
  else if (e.target === lang || !lang.contains(e.target)) shut(lang);
}));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  langs.forEach(lang => { if (lang.open) { shut(lang); lang.querySelector('summary').focus(); } });
});
</script>

<script src="/presentation.js" data-enlarge="{{viewer_enlarge}}" data-close="{{viewer_close}}" data-previous="{{viewer_previous}}" data-next="{{viewer_next}}" defer></script>
