<script>
// Register before first reveal, including restored history entries.
(() => {
  let transition;
  window.addEventListener("pagereveal", event => {
    transition = event.viewTransition;
    if (!transition) {
      document.documentElement.classList.remove("page-crossfade");
      return;
    }
    const current = transition;
    document.documentElement.classList.add("page-crossfade");
    current.finished.catch(() => {}).finally(() => {
      if (transition !== current) return;
      transition = null;
      document.documentElement.classList.remove("page-crossfade");
    });
  });
  // Intent takes priority over decoration; never consume the user's event.
  const interrupt = () => transition?.skipTransition();
  window.addEventListener("pointerdown", interrupt, { capture: true, passive: true });
  window.addEventListener("keydown", interrupt, { capture: true });
})();
</script>
</head>
